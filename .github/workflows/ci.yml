name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - run: cargo test --workspace --features testkit -- --test-threads=1

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: clippy
      - run: cargo clippy --workspace --all-targets --features testkit -- -D warnings

  feature-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: POSIX backend compiles
        run: cargo check -p osal --no-default-features --features backend-posix

      - name: Mock backend compiles
        run: cargo check -p osal --no-default-features --features backend-mock

      - name: FreeRTOS fixture compiles
        run: cargo check -p osal --no-default-features --features freertos-test-fixture

      - name: FreeRTOS backend skeleton compiles (fixture)
        run: cargo check -p osal-backend-freertos --features test-fixture

      - name: FreeRTOS native facade smoke build
        env:
          OSAL_FREERTOS_KERNEL_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/kernel/include
          OSAL_FREERTOS_CONFIG_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/config
          OSAL_FREERTOS_PORT_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/port
        run: cargo check -p osal --no-default-features --features backend-freertos

      - name: FreeRTOS native build (missing TLS index)
        env:
          OSAL_FREERTOS_KERNEL_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/kernel/include
          OSAL_FREERTOS_CONFIG_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/config-missing-tls
          OSAL_FREERTOS_PORT_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/port
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-freertos-neg-missing-tls
        run: |
          OUT=$(cargo check -p osal --no-default-features --features backend-freertos 2>&1) && {
            echo "Expected build to fail when OSAL_FREERTOS_TASK_TLS_INDEX is missing"
            exit 1
          }
          echo "$OUT" | grep -q 'must define OSAL_FREERTOS_TASK_TLS_INDEX' || {
            echo "Missing TLS index: wrong diagnostic"
            exit 1
          }
          echo "Correctly failed (missing TLS index)"

      - name: FreeRTOS native build (negative TLS index)
        env:
          OSAL_FREERTOS_KERNEL_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/kernel/include
          OSAL_FREERTOS_CONFIG_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/config-negative-tls
          OSAL_FREERTOS_PORT_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/port
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-freertos-neg-negative-tls
        run: |
          OUT=$(cargo check -p osal --no-default-features --features backend-freertos 2>&1) && {
            echo "Expected build to fail when OSAL_FREERTOS_TASK_TLS_INDEX is negative"
            exit 1
          }
          echo "$OUT" | grep -q 'must be non-negative' || {
            echo "Negative TLS index: wrong diagnostic"
            exit 1
          }
          echo "Correctly failed (negative TLS index)"

      - name: FreeRTOS native build (TLS index exceeds slots)
        env:
          OSAL_FREERTOS_KERNEL_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/kernel/include
          OSAL_FREERTOS_CONFIG_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/config-invalid-tls
          OSAL_FREERTOS_PORT_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/port
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-freertos-neg-invalid-tls
        run: |
          OUT=$(cargo check -p osal --no-default-features --features backend-freertos 2>&1) && {
            echo "Expected build to fail when OSAL_FREERTOS_TASK_TLS_INDEX exceeds slots"
            exit 1
          }
          echo "$OUT" | grep -q 'exceeds configNUM_THREAD_LOCAL_STORAGE_POINTERS' || {
            echo "TLS index exceeds slots: wrong diagnostic"
            exit 1
          }
          echo "Correctly failed (TLS index exceeds slots)"

      - name: FreeRTOS native build (zero minimal stack)
        env:
          OSAL_FREERTOS_KERNEL_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/kernel/include
          OSAL_FREERTOS_CONFIG_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/config-zero-minimal-stack
          OSAL_FREERTOS_PORT_INCLUDE: ${{ github.workspace }}/tests/freertos-native-fixture/port
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-freertos-neg-zero-minimal-stack
        run: |
          OUT=$(cargo check -p osal --no-default-features --features backend-freertos 2>&1) && {
            echo "Expected build to fail when configMINIMAL_STACK_SIZE is zero"
            exit 1
          }
          echo "$OUT" | grep -q 'configMINIMAL_STACK_SIZE must be greater than zero' || {
            echo "Zero minimal stack: wrong diagnostic"
            exit 1
          }
          echo "Correctly failed (zero minimal stack)"

      - name: No backend must fail
        run: |
          if cargo check -p osal --no-default-features 2>/dev/null; then
            echo "Expected no-backend build to fail"
            exit 1
          fi

      - name: POSIX + Mock must fail
        run: |
          if cargo check -p osal --no-default-features --features backend-posix,backend-mock 2>/dev/null; then
            echo "Expected posix+mock build to fail"
            exit 1
          fi

      - name: POSIX + FreeRTOS must fail
        run: |
          if cargo check -p osal --no-default-features --features backend-posix,freertos-test-fixture 2>/dev/null; then
            echo "Expected posix+freertos build to fail"
            exit 1
          fi

      - name: Mock + FreeRTOS must fail
        run: |
          if cargo check -p osal --no-default-features --features backend-mock,freertos-test-fixture 2>/dev/null; then
            echo "Expected mock+freertos build to fail"
            exit 1
          fi

      - name: All three backends must fail
        run: |
          if cargo check -p osal --no-default-features --features backend-posix,backend-mock,freertos-test-fixture 2>/dev/null; then
            echo "Expected three-backend build to fail"
            exit 1
          fi

  rustdoc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - run: cargo doc --workspace --no-deps --features testkit

  task-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: POSIX task contracts
        run: cargo test -p osal-backend-posix --features testkit task -- --test-threads=1
      - name: Mock task contracts
        run: cargo test -p osal-backend-mock --features testkit task -- --test-threads=1

  freertos-qemu-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Install Rust bare-metal target
        run: rustup target add thumbv7m-none-eabi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm make python3

      - name: Record tool versions
        run: |
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1
          cargo --version
          rustup target list --installed | grep thumb

      - name: Build firmware
        run: integration/freertos-qemu-mps2/scripts/build.sh

      - name: Run boot smoke
        run: integration/freertos-qemu-mps2/scripts/run-qemu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freertos-qemu-boot
          path: |
            integration/freertos-qemu-mps2/build/*.elf
            integration/freertos-qemu-mps2/build/*.map
            integration/freertos-qemu-mps2/build/*.log
            integration/freertos-qemu-mps2/build/*.txt

  freertos-qemu-queue-blocking:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Install Rust bare-metal target
        run: rustup target add thumbv7m-none-eabi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm make python3

      - name: Record tool versions
        run: |
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1
          cargo --version
          rustup target list --installed | grep thumb

      - name: Build firmware (queue-blocking)
        env:
          CARGO_FEATURES: suite-queue-blocking
        run: integration/freertos-qemu-mps2/scripts/build.sh

      - name: Run queue-blocking smoke
        env:
          PROFILE: queue-blocking
        run: integration/freertos-qemu-mps2/scripts/run-qemu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freertos-qemu-queue-blocking
          path: |
            integration/freertos-qemu-mps2/build/*.elf
            integration/freertos-qemu-mps2/build/*.map
            integration/freertos-qemu-mps2/build/*.log
            integration/freertos-qemu-mps2/build/*.txt

  freertos-qemu-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Install Rust bare-metal target
        run: rustup target add thumbv7m-none-eabi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm make python3

      - name: Record tool versions
        run: |
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1
          cargo --version
          rustup target list --installed | grep thumb

      - name: Build firmware (task)
        env:
          CARGO_FEATURES: suite-task
        run: integration/freertos-qemu-mps2/scripts/build.sh

      - name: Run task smoke
        env:
          PROFILE: task
        run: integration/freertos-qemu-mps2/scripts/run-qemu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freertos-qemu-task
          path: |
            integration/freertos-qemu-mps2/build/*.elf
            integration/freertos-qemu-mps2/build/*.map
            integration/freertos-qemu-mps2/build/*.log
            integration/freertos-qemu-mps2/build/*.txt