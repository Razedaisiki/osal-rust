[workspace]

[package]
name = "osal-integration-freertos-qemu-mps2"
version = "0.1.0"
edition = "2024"
description = "Rust staticlib linked into the OSAL FreeRTOS QEMU MPS2 firmware"

[lib]
crate-type = ["staticlib"]

[dependencies]
osal-backend-freertos-sys = { path = "../../../crates/osal-backend-freertos-sys" }
osal-backend-freertos = { path = "../../../crates/osal-backend-freertos", features = ["integration-test-hooks"] }
osal-api = { path = "../../../crates/osal-api" }
osal = { path = "../../../crates/osal", default-features = false, features = ["backend-freertos"] }

[features]
default = ["suite-aggregate"]
suite-aggregate = []
suite-queue-blocking = []
suite-task = []
suite-timer = []
suite-mixed = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
